# config/futures_specs.yaml — frozen Treasury-futures contract table (refine cycle
# 2026-07-21, REFINE_ARCHITECTURE §2/§8). Additive; consumed by src/deploy/v2/
# (H3 expression adapter, H6 curve-point frontier). Rule: contract facts come from
# THIS file, never hardcoded in a sleeve/module.
#
# Provenance (external facts, fetched + cited 2026-07-21):
#   * Tick sizes / multipliers: CME "Understand Treasuries Contract Specifications"
#     (cmegroup.com/education/courses/introduction-to-treasuries/) — ZF minimum tick
#     1/4 of 1/32 = $7.8125; ZN 1/2 of 1/32 = $15.625; ZB 1/32 = $31.25; all on a
#     $100,000 face, $1,000 per full point.
#   * Initial margins: CME margin pages (cmegroup.com/markets/interest-rates/
#     us-treasury/*.margins.html) via NinjaTrader's published CME margin sheet
#     (updated 2025-11-13): ZF $1,375, ZN $2,063, ZB $4,070 per contract. Margins
#     float with vol — treat as central estimates, re-check before live deploy.
#   * half_spread_bp: ZN 0.8 and ZB 1.3 are FROZEN from results/CALENDAR_v3.md
#     (the tested futures cost model). ZF is derived by the same tick math those
#     two reconcile to: half-tick $3.91 on ~$108k notional ~= 0.36bp, rounded UP
#     to 0.5bp (conservative; ZF's book is as deep as ZN's).
#   * dv01_per_contract_usd: APPROXIMATE 2025-era CTD DV01s, informational ONLY —
#     the v2 engines risk-match EMPIRICALLY on trailing realized vol / actual
#     settle notionals, never on this column.

ZF:
  name: "5-Year U.S. Treasury Note future"
  multiplier_usd_per_point: 1000.0
  tick_usd: 7.8125
  half_spread_bp: 0.5
  initial_margin_usd: 1375.0
  dv01_per_contract_usd: 45.0      # informational, not consumed by engines
ZN:
  name: "10-Year U.S. Treasury Note future"
  multiplier_usd_per_point: 1000.0
  tick_usd: 15.625
  half_spread_bp: 0.8              # frozen, results/CALENDAR_v3.md
  initial_margin_usd: 2063.0
  dv01_per_contract_usd: 65.0      # informational, not consumed by engines
ZB:
  name: "30-Year U.S. Treasury Bond future"
  multiplier_usd_per_point: 1000.0
  tick_usd: 31.25
  half_spread_bp: 1.3              # frozen, results/CALENDAR_v3.md
  initial_margin_usd: 4070.0
  dv01_per_contract_usd: 130.0     # informational, not consumed by engines
