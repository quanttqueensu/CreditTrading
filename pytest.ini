[pytest]
# Scope collection to the real test suites.
#
# WHY THIS FILE EXISTS
# --------------------
# A bare `python3 -m pytest` used to fail at COLLECTION with
# ConnectionRefusedError on 127.0.0.1:7497, before running a single test.
# The cause: four files match pytest's default discovery patterns but are not
# unit tests, and one of them -- scripts/audit/moc_routing_test.py -- opens a
# LIVE BROKER CONNECTION at import time and transmits a test order to the
# closing auction. Collection imports every matched module, so merely running
# the test suite reached for the broker.
#
# That is the worst possible shape for a mistake here: the safest-looking
# command in the repo touching the order path. Scoping collection fixes it at
# the root rather than relying on everyone remembering to pass a path.
#
# The four non-test files that match the default patterns:
#   scripts/audit/moc_routing_test.py   LIVE broker probe - transmits an order
#   ops/smoke_test.py                   operational smoke check (archived 2026-09-14)
#   scripts/cef/discount_test.py        research script
#   scripts/rv/holdout_test.py          research script (archived 2026-09-14 to _archive/)
#
# To run one of those deliberately, invoke it directly as a script. Do not
# widen testpaths to include them.

# On widening this list: the danger above is specific and is about those four
# files, not about the number of entries. A new directory is safe iff nothing it
# imports opens a socket at import time. `.claude/hooks/tests` was re-added on
# 2026-09-11 for `book_state.py`, which is pure-stdlib file reading and is the
# single reader behind the SessionStart banner, the status line and five skills;
# it had been reading the wrong worktree since the prod split and reported a
# clean book while a halt was active. That is exactly the class of defect a
# green suite is supposed to make impossible.
# `scripts/gamma/tests` was added 2026-09-12 against the condition above, and
# the condition was CHECKED, not assumed: its only repo import is
# `scripts/gamma/fetch_cboe_vol_indices`, which imports `urllib.request` at
# module level but performs no I/O until `fetch_one()` is CALLED. The tests
# never call it -- they build frames by hand and assert on the guards -- so
# collection opens nothing. Re-check that if the module gains an import-time
# fetch, a module-level `pd.read_parquet`, or a broker client.
testpaths =
    src/analysis/tests
    src/backtest/tests
    src/deploy/tests
    ops/tests
    scripts/cef/tests
    scripts/gamma/tests
    .claude/hooks/tests

# `_archive` (2026-09-13): the repo's one archive folder, which will receive
# retired research code. Some of it matches the default discovery patterns
# (`scripts/rv/holdout_test.py` above, now there, is one), and nothing in it is a test of
# anything that runs. `testpaths` already excludes it; this holds if someone
# passes a broad path by hand.
norecursedirs = data results ops/books .git __pycache__ .pytest_cache archive _archive

addopts = -q --strict-markers

filterwarnings =
    ignore::DeprecationWarning
