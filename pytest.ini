[pytest]
# Scope collection to the real test suites.
#
# WHY: a bare `python3 -m pytest` once imported a script that opened a LIVE
# BROKER CONNECTION at import time and transmitted a test order (it matched
# pytest's default discovery patterns; deleted in the 2026-09-28 clean slate).
# Scoping collection fixes that class of mistake at the root. A directory is
# safe to add here only if nothing it imports opens a socket at import time;
# the root conftest.py also blocks every network connection during tests
# (ops/netguard.py).
#
# `quantt/session/tests`, `quantt/deploy/tests`, `src/data/tests` (2026-09-28,
# the runner build): HTTP is a fake client, the installer imports only the
# standard library, and the R2 module imports duckdb/dotenv inside functions.
#
# `quantt/tests` (2026-09-28): `quantt.broker.alpaca_probe` imports only stdlib
# at module level; `requests` and `dotenv` are imported inside the functions
# that use them, and the tests pass a fake session.
#
# `quantt/collect/tests` (2026-09-29, the data collector): `quantt.collect.collect`
# imports only stdlib, `ops.schedule.nyse_calendar`, `quantt.broker.alpaca`,
# `quantt.session.records` and (2026-10-13) `quantt.session.nav_gate` at module
# level; nav_gate imports only stdlib at module level. pandas, requests and
# fetch_daily are imported inside the functions that use them, and the tests
# inject a fake client, fake runners and a fake CEFConnect reader.
# `scripts/gamma/tests` (2026-10-11, restored from tag pre-clean-slate with the
# Cboe fetcher): the fetchers import only urllib/pandas at module level and the
# tests call their parsers on literal strings; `tlt_atm_iv` imports R2 and the
# Alpaca probe inside functions only. `g2_spreads` and `g2_gate` (2026-10-12)
# import stdlib, numpy, pandas, `scripts.cef.spec` (a JSON read) and
# `vrp_summary` at module level; R2, Alpaca and scipy are imported inside the
# functions that use them, and the tests feed them synthetic frames.
#
#
# `scripts/rv/tests` (2026-10-11, the restored ETF fetchers): they import only
# `scripts.rv.alpaca_daily` (stdlib, numpy, pandas at module level;
# `quantt.broker.alpaca` is imported inside `make_client`, which no test calls)
# and `scripts.rv.panel_identity` (pandas, pyarrow). The stage_* fetchers, which
# import yfinance, are not imported by any test. The client is a fake.
#
# `scripts/events/tests` (2026-10-11, the event re-runs): `scripts.events.*` and
# `scripts.data.term_cef_census` import only stdlib, numpy and pandas at module
# level; R2 (`src.data.r2`) and Alpaca (`quantt.broker.alpaca`) are imported
# inside the functions that fetch, which the tests never call.
#
# `scripts/data/tests` (2026-10-12, the EDGAR event fetcher, plan 0.7): it
# imports `scripts.data.edgar_client` (stdlib only at module level; `requests`
# and `dotenv` are imported inside the functions that fetch or read the env
# file) and `scripts.data.fetch_edgar_events` (stdlib and pandas). The tests
# pass a fake session; nothing opens a socket.
# `scripts/data/tests` (2026-10-12, the C4 CEF-families data build): the
# `scripts.data.*cef_families*` modules import only stdlib, numpy and pandas at
# module level; yfinance, requests, R2 (`src.data.r2`), Alpaca
# (`quantt.broker.alpaca`) and the frozen spec are imported inside the functions
# that fetch or run, which the tests never call. `cef_crosscheck_crsp`, imported
# inside `permno_map`, is pandas/numpy only at module level.
# `scripts/xasset/tests` (2026-10-12, the XASSET slate feasibility check):
# `scripts.xasset.slate_feasibility` imports only stdlib and pandas at module
# level; `quantt.broker.alpaca` (Alpaca) and `scripts.cef.validate` are imported
# inside the functions that need them, and the tests never call the Alpaca one.
testpaths =
    src/backtest/tests
    src/deploy/tests
    ops/tests
    scripts/cef/tests
    .claude/hooks/tests
    quantt/tests
    quantt/session/tests
    quantt/deploy/tests
    quantt/collect/tests
    src/data/tests
    scripts/gamma/tests
    scripts/rv/tests
    scripts/events/tests
    scripts/data/tests
    scripts/xasset/tests

norecursedirs = data results ops/books .git __pycache__ .pytest_cache

addopts = -q --strict-markers

filterwarnings =
    ignore::DeprecationWarning
