[pytest]
# Scope collection to the real test suites.
#
# WHY THIS FILE EXISTS
# --------------------
# A bare `python3 -m pytest` used to fail at COLLECTION with
# ConnectionRefusedError on 127.0.0.1:7497, before running a single test.
# The cause: four files match pytest's default discovery patterns but are not
# unit tests, and one of them -- scripts/audit/moc_routing_test.py -- opens a
# LIVE BROKER CONNECTION at import time and transmits a test order to the
# closing auction. Collection imports every matched module, so merely running
# the test suite reached for the broker.
#
# That is the worst possible shape for a mistake here: the safest-looking
# command in the repo touching the order path. Scoping collection fixes it at
# the root rather than relying on everyone remembering to pass a path.
#
# The four non-test files that match the default patterns:
#   scripts/audit/moc_routing_test.py   LIVE broker probe - transmits an order
#   ops/smoke_test.py                   operational smoke check, run by hand
#   scripts/cef/discount_test.py        research script
#   scripts/rv/holdout_test.py          research script
#
# To run one of those deliberately, invoke it directly as a script. Do not
# widen testpaths to include them.

testpaths =
    src/analysis/tests
    src/backtest/tests
    src/deploy/tests
    .claude/hooks/tests

norecursedirs = data results ops/books .git __pycache__ .pytest_cache archive

addopts = -q --strict-markers

filterwarnings =
    ignore::DeprecationWarning
